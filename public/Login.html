<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8" />
        <title>Museu de Poemas</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link href="/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
        <!--senha: @Helio123456-->
        <style>
            html, body {
                height: 100%;
            }

            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #fbe9e7;
                color: #2a0f2f;
                font-family: 'Merriweather';
            }

            .login-card {
                width: 100%;
                max-width: 400px;
                padding: 2rem;
                border: none;
                border-radius: 1rem;
                box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
                background-color: #F9C5AE;
            }

            .login-title {
                text-align: center;
                margin-bottom: 1.5rem;
                font-weight: 600;
            }

            .page-title {
                text-align:center;
                margin-top: 0.5em;
                margin-bottom: 1em;
                font-weight: 700;
                color: #5c2a5f;
                font-family: 'Lora';
            }

            .btn-custom {
                background-color: #c06c84;
                border-color: #c06c84;
                color: #fbe9e7;
            }

            table {
                margin-top: 1em;
            }
        </style>
    </head>

    <body>
        <div class="page-title">
            <h1 class="page-title" style="font-size: 55px">Museu de Poemas</h1>
            <h3 class="page-title">Seja bem-vindo</h3>
        </div>

        <div class="card login-card">
            <h1 class="login-title" style="color: #5c2a5f;">Login</h1>

            <div class="mb-3">
                <input type="text" id="txtUsuario" class="form-control mb-2" placeholder="e-mail"/>
                <input type="password" id="txtSenha" class="form-control mb-2" placeholder="senha"/>
            </div>

            <div class="mb-3 d-grid" id="divBotoes"></div>

            <div id="divResposta"></div>
        </div>

        <div id="divTabela"></div>

        <script type="module">
            import ApiService from './ApiService.js';

            const api = new ApiService("o token ainda será gerado");

            let API_DATA;

            const txtUsuario = document.getElementById("txtUsuario");
            const txtSenha = document.getElementById("txtSenha");

            const divBotoes = document.getElementById("divBotoes");
            const divResposta = document.getElementById("divResposta");

            function createButton(text, className) {
            const btn = document.createElement("button");
            btn.textContent = text;
            btn.className = `btn ${className} me-2 mb-2`; 
            return btn;
            }

            const btnLogin = createButton("Login", "btn-custom");
            btnLogin.onclick = async function btnListar_click() {
            

            if (txtUsuario.value.trim() == "") {
                divResposta.textContent = "Usuário Inválido";
                divResposta.className = "alert alert-danger";
                return;
            } else if (txtSenha.value.trim() == "") {
                divResposta.textContent = "Senha Inválida";
                divResposta.className = "alert alert-danger";
                return;
            }

            const dadosLogin = {
                "usuario": {
                    "email": txtUsuario.value.trim(),
                    "senha": txtSenha.value.trim()
                }
            }

            const respostaAPI = await api.post("/usuarios/login", dadosLogin);
            console.log(respostaAPI)
            if (respostaAPI.success == true) {
                localStorage.setItem("userData", JSON.stringify(respostaAPI)); // converte a resposta para texto e armazena no local storage na variavel userData
                window.location.href = "dashboard.html";
            }

            // Atualiza a lista após criar
        };
        divBotoes.appendChild(btnLogin);
        </script>

    </body>
</html>
