<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8"/>
        <title> </title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        
        <link href="/css/bootstrap.min.css" rel="stylesheet" />
        <script src="/js/bootstrap.bundle.min.js"></script>
 
        <style>
            body {
                padding: 2em;
            }

            table {
                margin-top: 1em;
            }
        </style>
    </head>

    <body class="container">
        <!--TITULO-->
        <h1 class="mb-4">Gerenciamento de Poemas</h1>

        <!--FILTRO-->
        <div class="card mb-3">
            <div class="card-header">
                Filtro de busca de Poemas
            </div>
            <div class="card-body">
                <label for="txtFiltroPoema" class="form-label">Título do Poema</label>
                <input type="text" id="txtFiltroPoema" class="form-control" placeholder="Digite o título do poema">
            </div>
        </div>

        <!--CADASTRO-->
        <div class="card mb-3">
            <div class="card-header">
            Cadastro de Poema
            </div>

            <div class="card-body">
            <div class="mb-3">
                <input type="number" id="txtId" class="form-control mb-2" disabled placeholder="ID (para update ou delete)" />
                <input type="text" id="txtTitulo" class="form-control mb-2" placeholder="Título" />
            </div>
            <div class="mb-3 d-flex gap-2" id="divBotoes"></div>
            <div id="divResposta"></div>
            </div>
        </div>

        <!--LISTAGEM-->
        <div class="card mt-4">
            <div class="card-header">
            Lista de Poemas
            </div>
            <div class="card-body">
            <!-- Div onde a tabela será renderizada dinamicamente -->
            <div id="divTabela"></div>
            </div>
        </div>

        <!-- Modal de confirmação -->
        <div class="modal fade" id="modalConfirm" tabindex="-1" aria-labelledby="modalConfirmLabel" aria-hidden="true">
            <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                <h5 class="modal-title" id="modalConfirmLabel">Confirmar Exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                Tem certeza que deseja excluir este Poema?
                </div>
                <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btnConfirmDelete">Excluir</button>
                </div>
            </div>
            </div>
        </div>

        <!--SCRIPT PRINCIPAL-->
        <script type="module">
            import ApiService from './ApiService.js';
            const divUsuario = document.getElementById("divUsuario");

            let userData = localStorage.getItem("userData");

            if (userData) {
            userData = JSON.parse(userData);
            } else {
            window.location.href = "login.html"; 
            }
            
            const token = userData.data.token;

            const api = new ApiService(token);

            let API_DATA;

            const txtId = document.getElementById("txtId");
            const txtTitulo = document.getElementById("txtTitulo");
            const divBotoes = document.getElementById("divBotoes");
            const divResposta = document.getElementById("divResposta");

            //para criar botoes dinamicamente
            function createButton(text, className){
                const btn = document.createElement("button");
                btn.textContent = text;
                btn.className = `btn ${className} flex-fill`;
                return btn;
            }

            //BOTOES CRUD

            //LISTAR
            const btnListar = createButton("Listar", "btn-primary");
            btnListar.onclick = async function btnListar_click() {
                listAll();
            };
            divBotoes.appendChild(btnListar);
           
            //CREATE
            const btnCriar = createButton("Criar", "btn-success");
            btnCriar.onclick = async function btnCriar_click(){
                if (txtTitulo.value.trim() == ""){
                    divResposta.textContent = "Título inválido";
                    divResposta.className = "alert alert-warning";
                    return;
                }

                const objetoCriar = {
                    "poema": { "titulo": txtTitulo.value.trim() }
                };

                await api.post("/poemas", objetoCriar);

                listAll();
            };
            divBotoes.appendChild(btnCriar);

            //UPDATE
            const btnAtualizar = createButton("Atualizar", "btn-warning");
            btnAtualizar.onclick = async function btnAtualizar_click(){
                const id = txtId.value.trim();
                if(!id){
                    divResposta.textContent = "Selecione um poema para atulizar";
                    divResposta.className = "alert alert-warning";
                    return
                }
                const objetoAtualizar = {
                    "poema": { "titulo": txtTitulo.value.trim() }
                };

                await api.put("/poemas", id, objetoAtualizar);
                listAll();
            };
            divBotoes.appendChild(btnAtualizar);

            //DELETE
            const btnExcluir = createButton("Excluir", "btn-danger");
            btnExcluir.onclick = function () {
                const id = txtId.value.trim();
                if(!id){
                    divResposta.textContent="Selecione um poema para excluir";
                    divResposta.className="alert alert-warning";
                    return;
                }

                //MODAL
                const modal = new bootstrap.Modal(document.getElementById('modalConfirm'));
                modal.show();

                //CONFIRMACAO NO MODAL
                const btnConfirmDelete = document.getElementById("btnConfirmDelete");
                btnConfirmDelete.onclick = async function (){
                    await api.delete("/poemas", id);
                    listAll();
                    divResposta.textContent = `Poema ID ${id} excluído com sucesso.`;
                    divResposta.className = "alert alert-success";
                    txtId.value = "";
                    txtTitulo.value = "";
                    modal.hide();
                };
            };
            divBotoes.appendChild(btnExcluir);

            //BUSCAR E EXIBIR EM TABELA
            async function listAll() {
                API_DATA = await api.get("/poemas");

                if (API_DATA.success == true){
                    renderTable(API_DATA);
                } else {
                    //tratamento de erro opcional;
                }
            }

            //MONTAR DINAMICAMENTE TABELA NO DOM
            function renderTable(dados){
                const divTabela = document.getElementById("divTabela");
                divTabela.innerHTML = "";

                const table = document.createElement("table");
                table.className = "table table-bordered table-striped";

                const thead = document.createElement("thead");
                thead.className = "table-light";
                const trHead = document.createElement("tr");

                ["ID", "Titulo", "Ações"].forEach(text => {
                    const th = document.createElement("th");
                    th.textContent = text;
                    trHead.appendChild(th);
                });

                thead.appendChild(trHead);
                table.appendChild(thead);

                //CORPO DA TABELA
                const tbody = document.createElement("tbody");

                //itera sobre cada poema !
                dados.data.poemas.forEach(poema => {
                    const tr = document.createElement("tr");

                    const tdId=document.createElement("td");
                    tdId.textContent = poema.idPoema;
                    tr.appendChild(tdId);

                    const tdNome = document.createElement("td");
                    tdNome.textContent = poema.titulo;
                    tr.appendChild(tdNome);

                    // célula e container de ações LOCAIS a esta linha
                    // (nunca reaproveitar a divBotoes global do cadastro aqui!)
                    const tdAcoes = document.createElement("td");
                    const divBotoesLinha = document.createElement("div");
                    divBotoesLinha.className = "d-flex gap-2";

                    //botao selecionar
                    const btnSel = createButton("Selecionar", "btn-info");
                    btnSel.onclick = function(){
                        txtId.value = poema.idPoema;
                        txtTitulo.value = poema.titulo;
                        divResposta.textContent = "";
                        divResposta.className = "";
                    };
                    divBotoesLinha.appendChild(btnSel);

                    tdAcoes.appendChild(divBotoesLinha);
                    tr.appendChild(tdAcoes);

                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                divTabela.appendChild(table);
            }

            //filtro em tempo real
            txtFiltroPoema.addEventListener("input", function (){
                const filtro = txtFiltroPoema.value.trim().toLowerCase();

                if(!API_DATA || !API_DATA.data || !API_DATA.data.poemas) return;

                const dadosFiltrados = {
                    data: {
                        poemas: API_DATA.data.poemas.filter(poema =>
                            poema.titulo.toLowerCase().includes(filtro)
                        )
                    }
                };

                renderTable(dadosFiltrados);
                txtId.value="";
            });

            listAll();
        </script>
    </body>

    
</html>
