<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>CRUD Usuários com ApiService</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/css/bootstrap.min.css" rel="stylesheet" />
  <script src="/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      padding: 2em;
    }

    table {
      margin-top: 1em;
    }
  </style>
</head>

<body class="container">
  <h1 class="mb-4">Gerenciamento de Usuários</h1>

  <!--FILTRO -->
  <div class="card mb-3">
    <div class="card-header">Filtro de Usuário</div>
    <div class="card-body">
      <label for="txtFiltroNome" class="form-label">Nome do usuário</label>
      <input type="text" id="txtFiltroNome" class="form-control" placeholder="Digite o nome do usuário">

      <input type="checkbox" id="chkAdminFiltro" class="form-check-input">
      <label class="form-check-label" for="chkAdminFiltro">É Admin</label>
    </div>
  </div>

  <!--CADASTRO-->
  <div class="card mb-4">
    <div class="card-header">Cadastro de Usuário</div>
    <div class="card-body">
      <div class="mb-3">
        <input type="number" id="txtId" class="form-control mb-2" disabled placeholder="ID (para update ou delete)" />

        <input type="text" id="txtNomeUsuario" class="form-control mb-2" placeholder="Nome" />
        <input type="text" id="txtEmail" class="form-control mb-2" placeholder="Email" />
        <input type="password" id="txtSenha" class="form-control mb-2" placeholder="Senha" />

        <div class="form-check mb-2">
          <input type="checkbox" id="chkAdmin" class="form-check-input">
          <label class="form-check-label" for="chkAdmin">É Admin</label>
        </div>
        </select>

      <!-- Div onde os botões CRUD (Criar, Atualizar, Excluir, Listar) serão criados -->
      <div class="mb-3 d-flex gap-2" id="divBotoes"></div>
    </div>

    <!-- Div usada para exibir mensagens de sucesso ou erro -->
    <div id="divResposta" class="alert d-inline-block p-2"></div>
  </div>

  <!-- CARD: Tabela de Usuários -->
  <div class="card mt-4">
    <div class="card-header">
      Lista de Usuários
    </div>

    <!-- Corpo do card, onde a tabela realmente será exibida -->
    <div class="card-body">
      <!-- Div onde a tabela será inserida dinamicamente via JavaScript -->
      <div id="divTabela"></div>
    </div>
  </div>
  <!-- Modal de Confirmação -->
  <div class="modal fade" id="modalConfirm" tabindex="-1" aria-labelledby="modalConfirmLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <!-- Cabeçalho do modal -->
        <div class="modal-header">
          <h5 class="modal-title" id="modalConfirmLabel">Confirmação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <!-- Corpo do modal -->
        <div class="modal-body">
          Tem certeza que deseja excluir este registro?
        </div>

        <!-- Rodapé do modal -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmDelete">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import ApiService from './ApiService.js';

    //AUTENTICAÇÃO E CONFIGURAÇÃO INICIAL 
    let userData = localStorage.getItem("userData");
    if (userData) userData = JSON.parse(userData);
    else window.location.href = "login.html"; 
    const token = userData.data.token; 
    const api = new ApiService(token); 

    let API_DATA; 

    //REFERÊNCIAS AOS ELEMENTOS HTML 
    const txtId = document.getElementById("txtId");
    const txtNomeUsuario = document.getElementById("txtNomeUsuario");
    const txtEmail = document.getElementById("txtEmail");
    const txtSenha = document.getElementById("txtSenha");
     const chkAdmin = document.getElementById("chkAdmin");

    const divBotoes = document.getElementById("divBotoes");
    const divResposta = document.getElementById("divResposta");

    // Campos do filtro
    const txtFiltroNome = document.getElementById("txtFiltroNome");
     const chkAdminFiltro = document.getElementById("chkAdminFiltro");

    //FUNÇÃO AUXILIAR PARA CRIAR BOTÕES 
    function createButton(text, className) {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.className = `btn ${className} flex-fill`; 
      return btn;
    }

    //OTÕES CRUD

    // BOTÃO LISTAR
    const btnListar = createButton("Listar", "btn-primary");
    btnListar.onclick = listAll;
    divBotoes.appendChild(btnListar);

    //CRIAR
    const btnCriar = createButton("Criar", "btn-success");
    btnCriar.onclick = async () => {
      if (txtNomeUsuario.value.trim() === "") {
        divResposta.textContent = "Nome inválido";
        divResposta.className = "alert alert-warning";
        return;

      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(txtEmail.value)) {
        divResposta.textContent = "Email inválido. Exemplo: usuario@dominio.com";
        divResposta.className = "alert alert-warning";
        return;
      }

      const senhaRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{6,}$/;

      if (!senhaRegex.test(txtSenha.value)) {
        divResposta.textContent = "Senha inválida: deve ter no mínimo 6 caracteres, 1 número, 1 letra maiúscula e 1 caractere especial";
        divResposta.className = "alert alert-warning";
        return;
      }

      const eadmin = chkAdmin.checked ? 1 : 0;

      // Monta o objeto que será enviado para a API
      const objetoCriar = {
        "usuario": {
          "nomeUSuario": txtNomeUsuario.value.trim(),
          "email": txtEmail.value.trim(),
          "senha": txtSenha.value.trim(),
          "admin": eadmin
        }
      };

      //POST
      const resposta = await api.post("/usuarios", objetoCriar);
      if (resposta.success) {
        divResposta.textContent = "Criado com sucesso!";
        divResposta.className = "alert alert-success";
        listAll(); // Atualiza a tabela
      } else {
        divResposta.textContent = resposta.error.message;
        divResposta.className = "alert alert-danger d-inline-block p-2";
      }
    };
    divBotoes.appendChild(btnCriar);

    //ATUALIZAR
    const btnAtualizar = createButton("Atualizar", "btn-warning");
    btnAtualizar.onclick = async () => {
      const id = txtId.value.trim();
      if (!id) {
        divResposta.textContent = "Selecione um usuário para atualizar";
        divResposta.className = "alert alert-danger";
        return;
      }

      const objetoAtualizar = {
        "usuario": {
          "nomeFuncionario": txtNomeUsuario.value.trim(),
          "email": txtEmail.value.trim(),
          "senha": txtSenha.value.trim(),
          "recebeValeTransporte": recebeVale,
        }
      };

      //PUT
      const resposta = await api.put("/usuarios", id, objetoAtualizar);
      if (!resposta.success) {
        divResposta.textContent = resposta.error.message;
        divResposta.className = "alert alert-danger";
      } else limparFormulario();
      listAll(); // Atualiza tabela
    };
    divBotoes.appendChild(btnAtualizar);

    //BOTÃO EXCLUIR
    const btnExcluir = createButton("Excluir", "btn-danger");

    btnExcluir.onclick = function () {
      const id = txtId.value.trim();

      if (!id) {
        divResposta.textContent = "Informe o ID.";
        divResposta.className = "alert alert-danger";
        return;
      }

      const modal = new bootstrap.Modal(document.getElementById('modalConfirm'));
      modal.show();
      const btnConfirmDelete = document.getElementById("btnConfirmDelete");
      btnConfirmDelete.replaceWith(btnConfirmDelete.cloneNode(true));
      const newBtnConfirm = document.getElementById("btnConfirmDelete");

      newBtnConfirm.onclick = async function () {
        try {
          await api.delete("/usuarios", id);
          listAll(); 
          divResposta.textContent = `Usuário ID ${id} excluído com sucesso.`;
          divResposta.className = "alert alert-success";
          limparFormulario();
        } catch (error) {
          divResposta.textContent = `Erro ao excluir usuário: ${error.message}`; ///////
          divResposta.className = "alert alert-danger";
        } finally {
          modal.hide(); // Fecha o modal
        }
      };
    };
    divBotoes.appendChild(btnExcluir);

    //FUNÇÕES DE SUPORTE
    async function listAll() {
      API_DATA = await api.get("/usuarios");
      if (API_DATA.success) renderTable(filterData());
    }

    function limparFormulario(message) {
      divResposta.textContent = message || "Operação realizada com sucesso!";
      divResposta.className = "alert alert-success";

      txtId.value = "";
      txtNomeUsuario.value = "";
      txtEmail.value = "";
      txtSenha.value = "";
      chkAdmin.checked = false;
    }

    // Função responsável por criar dinamicamente a tabela HTML com os dados
    // dos funcionários vindos da API (ou filtrados)
    function renderTable(dados) {
      const divTabela = document.getElementById("divTabela");

      divTabela.innerHTML = "";

      const table = document.createElement("table");
      table.className = "table table-bordered table-striped"; 

      const thead = document.createElement("thead");
      thead.className = "table-light";

      const trHead = document.createElement("tr");

      ["ID", "Nome", "Email", "Admin", "Ações"].forEach(text => {
        const th = document.createElement("th"); 
        th.textContent = text;
        trHead.appendChild(th); 
      });

      thead.appendChild(trHead);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      dados.data.funcionarios.forEach(usuario => {
        const tr = document.createElement("tr"); 
 
        ["idUsuario", "nomeUsuario", "email"].forEach(key => {
          const td = document.createElement("td");
          td.textContent = usuario[key]; 
          tr.appendChild(td); 
        });

        const tdAdmin = document.createElement("td");
        tdAdmin.textContent = usuario.eadmin == 1 ? "Sim" : "Não";
        tr.appendChild(tdAdmin);

        const divBotoes = document.createElement("div");
        divBotoes.className = "d-flex gap-2";

        const tdAcoes = document.createElement("td");

        const btnSel = createButton("Selecionar", "btn-info");

        btnSel.onclick = () => {
          txtId.value = usuario.idUsuario;
          txtNomeUsuario.value = usuario.nomeUsuario;
          txtEmail.value = usuario.email;
          txtSenha.value = ""; 
          chkAdmin.checked = usuario.eadmin == 1;

          divResposta.textContent = "";
          divResposta.className = "";
        };
        divBotoes.appendChild(btnSel)
        tdAcoes.appendChild(divBotoes);

        tr.appendChild(tdAcoes);

        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      divTabela.appendChild(table);
    }


    //FILTROS EM TEMPO REAL
    [txtFiltroNome, chkAdminFiltro].forEach(el => {
      if (el.type === "checkbox") {
        el.addEventListener("change", () => renderTable(filterData()));
      } else {
        el.addEventListener("input", () => renderTable(filterData()));
      }
    });

    function filterData() {


      if (!API_DATA || !API_DATA.data || !API_DATA.data.usuarios) return API_DATA;

      const nomeFiltro = txtFiltroNome.value.trim().toLowerCase();


      const adminFiltro = chkAdminFiltro.checked ? 1 : 0;
      const adminFiltroAtivo = chkAdminFiltro.checked;

      const dadosFiltrados = API_DATA.data.usuarios.filter(f => {
        let match = true;

        if (nomeFiltro) {
          match = match && f.nomeUsuario.toLowerCase().includes(nomeFiltro);
        }

        if (!isNaN(cargoFiltro) && cargoFiltro != -1) {
          match = match && f.cargo.idCargo === cargoFiltro;
        }

        if (adminFiltroAtivo) {
          match = match && f.eadmin === adminFiltro;
        }

        return match;
      });
      return {
        data: {
          usuarios: dadosFiltrados
        }
      };
    }

    listAll();
  </script>
</body>

</html>
