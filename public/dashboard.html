<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <title>Dashboard - Museu de Poemas</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fbe9e7;
            color: #2a0f2f;
            padding: 2rem;
            font-family: 'Merriweather';
        }

        .page-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 2rem;
            margin-top: 3em;
        }

        #divUsuario {
            text-align: center;
            max-width: 400px;
            margin: 0 auto 2.5rem auto;
        }

        .cards-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            margin-top: 2em;
        }

        .dashboard-card {
            text-align: center;
            padding: 2rem 0.5rem;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: #2a0f2f;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.12);
        }

        .dashboard-card i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            margin-top: 1em;
        }

        .dashboard-card h5 {
            font-weight: 600;
        }

        .logout-footer {
            text-align: center;
            margin-top: 3rem;
            display: flex;
            justify-content: center;
        }

        #btnLogout-custom{
            padding: 0.5rem 2rem;
        }
    </style>
</head>

<body>

    <h1 class="page-title">Museu de Poemas</h1>
    <div id="divUsuario"></div>

    <div class="container cards-container">
        <div class="row g-4 justify-content-center w-100">
            <div class="col-md-4">
                <a href="Autores.html" class="dashboard-card" style="background-color: #7F428A;">
                    <h5>Autores</h5>
                    <p class="text-muted mb-0">Gerenciar autores cadastrados</p>
                </a>
            </div>

            <div class="col-md-4">
                <a href="Poemas.html" class="dashboard-card" style="background-color: #c06c84;">
                    <h5>Poemas</h5>
                    <p class="text-muted mb-0">Gerenciar poemas cadastrados</p>
                </a>
            </div>

            <div class="col-md-4">
                <a href="Usuarios.html" class="dashboard-card" style="background-color: #f8b195;">
                    <h5>Usuários</h5>
                    <p class="text-muted mb-0">Gerenciar usuários do sistema</p>
                </a>
            </div>
        </div>
    </div>

    <div class="logout-footer">
        <button id="btnLogout" class="btn btn-danger">Sair</button>
    </div>

    <script type="module">
        const divUsuario = document.getElementById("divUsuario");
        const btnLogout = document.getElementById("btnLogout");

        // Configura o logout primeiro, antes de qualquer coisa que possa falhar
        btnLogout.onclick = function () {
            localStorage.removeItem("userData");
            window.location.href = "login.html";
        };

        let userData = localStorage.getItem("userData");

        if (userData) {
            try {
                userData = JSON.parse(userData);
                divUsuario.textContent = "Bem-vindo, " + userData.data.usuario.nomeUsuario + "!";
            } catch (erro) {
                console.error("Erro ao processar dados do usuário:", erro);
                divUsuario.textContent = "Bem-vindo!";
            }
        } else {
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
